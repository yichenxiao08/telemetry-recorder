version: '3'

vars:
  BINARY: bin/signalscout.exe

tasks:
  build:
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -o {{.BINARY}} ./cmd/signalscout
  test:
    cmds:
      - go test -race ./...
  lint:
    cmds:
      - go run ./scripts/checkfmt
      - go vet ./...
      - golangci-lint run
  run:
    cmds:
      - go run ./cmd/signalscout serve
  benchmark-ingest:
    desc: Measure persisted OTLP HTTP ingest for all three signals with five seeds
    env:
      CGO_ENABLED: '0'
    cmds:
      - go run ./scripts/ingestbench {{.CLI_ARGS}}
  shop-demo:
    desc: Build and verify the shop pool-exhaustion demo with native intake
    deps: [build]
    cmds:
      - go run ./scripts/shopdemo {{.CLI_ARGS}}
  benchmark-store:
    desc: Measure seeded 1M-record storage growth and bounded SQL (not M4b pages)
    env:
      CGO_ENABLED: '0'
    cmds:
      - go run ./scripts/storebench {{.CLI_ARGS}}
  shop-load:
    desc: Send fixed-seed checkout traffic to an already running shop
    cmds:
      - go run ./scripts/shopload {{.CLI_ARGS}}
  shop-down:
    desc: Remove the demo's Compose containers and network
    cmds:
      - docker compose --project-name signalscout-shop --file samples/shop/compose.yml down
  diff-demo:
    desc: Validate M3 rankings and timing on an existing M2 demo database
    cmds:
      - go run ./scripts/diffdemo {{.CLI_ARGS}}
