name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: arduino/setup-task@v2
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { $files; exit 1 }
      - run: go vet ./...
      - run: go test -race ./...
      - run: task build
