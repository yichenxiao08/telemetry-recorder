name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: '3.54.0'
          repo-token: ${{ github.token }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { $files; exit 1 }
      - run: go vet ./...
      - run: go test -race ./...
      - run: task build

      - name: Synthetic Python probe safety
        shell: pwsh
        run: |
          python -m pip install uv==0.13.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m uv sync --project adapters/provenance-python --python 3.12.12 --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./scripts/framefixture -out .cache/provenance/frame-go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m uv run --directory adapters/provenance-python --frozen python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Privacy intake reset guard (repeat)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 20; $i++) {
            python -m uv run --directory adapters/provenance-python --frozen python -m unittest tests.test_privacy.Privacy.test_real_probe_intake_and_log_raw_copies
            if ($LASTEXITCODE -ne 0) { Write-Host "failed on repeat $i"; exit $LASTEXITCODE }
          }
