version: 1
id: lane-01
synthetic_only: true
unit: frame
profile: lane-01-v1
authored_blind: true
blindness_note: >-
  Outcome-blind, not independently authored: the owner specified the mechanisms
  and existing formulas were known. This file and the scoring contract are
  committed before generating or scoring evaluation data. Engine tests use only
  toy values/development seeds. No evaluation-driven constants, profile edits,
  feature selection or seed replacement. This synthetic construction can inflate
  results; it is not Subway Surfers reconstruction or evidence of real accuracy.
development_seeds: [101, 103]
evaluation_seeds: [1009, 2027, 3037, 4051, 5059]
variants:
  base:
    problem_stale_fraction: 1.0
    problem_gap_range: [0.50, 0.54]
    reference_gap_range: [0.65, 0.95]
    decoy_problem_offset: 0
  decoy-heavy:
    problem_stale_fraction: 1.0
    problem_gap_range: [0.50, 0.54]
    reference_gap_range: [0.65, 0.95]
    decoy_problem_offset: 10
  harder:
    problem_stale_fraction: 0.2
    problem_gap_range: [0.50, 0.54]
    reference_gap_range: [0.65, 0.95]
    decoy_problem_offset: 0
population:
  problem_frames: 100
  reference_frames: 100
  sessions: 10
  sampling_probability: 1.0
  expected_capture_fraction: 1.0
  missing_capture_policy: unknown_and_report_exclusions_never_zero
  annotations: synthetic-oracle-v1_wrong_returned_lane_vs_declared_expected_right
  reference_policy: explicit_reviewed_correct_same_profile_unit_and_time_window
  selection_bias: deliberately_constructed_case_control_not_population_rates
labels:
  - {feature: previous_age, role: mechanism, evidence: declared_previous_frame_version}
  - {feature: gap, role: contributing_mechanism, evidence: supplied_gap}
  - {feature: output.lane, role: symptom, evidence: returned_lane}
  - {feature: noise_0, role: decoy, evidence: supplied_unrelated_noise}
  - {feature: noise_1, role: decoy, evidence: supplied_unrelated_noise}
  - {feature: noise_2, role: decoy, evidence: supplied_unrelated_noise}
  - {feature: noise_3, role: decoy, evidence: supplied_unrelated_noise}
  - {feature: noise_4, role: decoy, evidence: supplied_unrelated_noise}
  - {feature: noise_5, role: decoy, evidence: supplied_unrelated_noise}
  - {feature: noise_6, role: decoy, evidence: supplied_unrelated_noise}
analysis:
  minimum_observed_runs_each_cohort: 10
  numeric_mad_factor: 1.4826
  numeric_squash: 3
  smoothing_success_failure: [1, 1]
  categorical: total_variation_laplace_1_over_observed_union
  reduction: last_completed_decision_per_step_per_run
  ties: score_descending_then_type_then_stable_feature_key
  previous_age: declared_profile_subtraction_frame_minus_previous_frame
  input_units_epsilon_floor:
    previous_age: [frame, 1, 1]
    gap: [ratio, 0.01, 0.01]
    noise_0: [arbitrary, 1, 0.1]
    noise_1: [arbitrary, 1, 0.1]
    noise_2: [arbitrary, 1, 0.1]
    noise_3: [arbitrary, 1, 0.1]
    noise_4: [arbitrary, 1, 0.1]
    noise_5: [arbitrary, 1, 0.1]
    noise_6: [arbitrary, 1, 0.1]
invariant:
  declaration_field: previous_used
  current_version_field: frame
  used_version_field: previous_frame
  expected_delta: 1
  missing_capture: unknown
  declaration_false: not_applicable
report:
  every_seed_and_variant: true
  mechanism_symptom_decoy_ranks: true
  top_k: [1, 3, 5]
  show_invariant_counts_and_capture: true
  expected_limits: >-
    Median age can hide a minority mechanism in harder. Seven correlated decoys
    can outrank real mechanisms in decoy-heavy. High base scores are inflated by
    deliberate separability and correlated case-control sampling. No retuning.
